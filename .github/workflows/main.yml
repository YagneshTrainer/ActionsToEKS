name: ReviewApp CICD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Application
        run: mvn clean package -DskipTests
    
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
    
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/reviewapp:${{ github.run_number }} . 
      
      - name: Push Docker Image
        run: docker push  ${{ secrets.DOCKER_USERNAME }}/reviewapp:${{ github.run_number }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ap-south-1
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cicd-lab --region ap-south-1

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/reviewapp-dep \
          reviewapp=${{ secrets.DOCKER_USERNAME }}/reviewapp:${{ github.run_number }}